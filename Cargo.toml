[workspace]
resolver = "2"
members = [
    "crates/sdd-cli",
    "crates/sdd-core",
    "crates/sdd-storage",
    "crates/sdd-parser",
    "crates/sdd-mcp",
    "crates/sdd-index",
    "crates/sdd-integrations",
    "poc/logistics-gateway",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/sdd-framework/sdd"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
sha2 = "0.10"
tempfile = "3"
